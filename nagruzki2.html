<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нагрузки 2.0</title>
<style>
:root{--ink:#1c2733;--mut:#5a6a7e;--line:#d7dfe8;--acc:#1b6ef3;--warn:#b26a00;--bad:#c62828;--ok:#1b8a3f;--bg:#f2f5f9}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header.top{background:#12233b;color:#fff;display:flex;align-items:center;gap:18px;padding:10px 18px;flex-wrap:wrap}
header.top .brand{font-weight:700}header.top .ver{background:#e67e22;color:#fff;border-radius:4px;padding:1px 7px;font-size:11px}
header.top a{color:#bcd3f5;text-decoration:none}header.top a.cur{color:#fff;font-weight:600}
main{max-width:1560px;margin:14px auto 60px;padding:0 12px}
section.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 8px}h3{font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px}
.toolbar label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:2px}
input,select{font:13px inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px}
button{font:13px inherit;padding:6px 12px;border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:6px;cursor:pointer}
button.primary{background:var(--acc);color:#fff}
table.grid{border-collapse:collapse;width:100%;font-size:12px}
table.grid th{background:#12233b;color:#fff;border:1px solid #33475f;padding:4px 6px;position:sticky;top:0}
table.grid td{border:1px solid var(--line);padding:2px 5px}
table.grid td.num{background:#eef3fa;text-align:right}
table.grid tr.rowres td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
table.grid tr.rowups td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.scrollx{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:6px}
.totgrid{display:flex;flex-wrap:wrap;gap:8px}.tot{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:210px;background:#f8fbff}
.tot b{display:block}.note{font-size:12px;color:var(--mut)}
#warnlist .e{color:var(--bad)}#warnlist .w{color:var(--warn)}
</style></head>
<body>
<header class="top"><span class="brand">НТД · Нефтегаз Электрика <span class="ver">v2.0</span></span>
<a href="index.html">Главная</a><a href="loads.html">Нагрузки 1.x</a><a class="cur" href="nagruzki2.html">Нагрузки 2.0</a></header>
<main>
<section class="card"><h2>Исходные данные</h2>
<div class="toolbar">
<label>Шаблон ОЛС<select id="tpl"><option value="A">А — 2 секции</option><option value="B">Б — 3 секции</option></select></label>
<label>Объект<br><input id="obj" style="width:240px" value="НКУ 0,4 кВ"></label>
<label>Заказчик<br><input id="cust" value="АО НТД"></label>
<label>U<select id="un"><option>0.4</option><option>10</option></select></label>
<label>Sкз МВА<input id="skz" type="number" value="250"></label>
<label>T1 кВА<input id="tr1" type="number" value="1000"></label>
<label>T2 кВА<input id="tr2" type="number" value="1000"></label>
<label>Uk %<input id="uk" type="number" value="6"></label>
<label>ДЭС<input id="dg" type="number" value="630"></label>
<label>ИБП<input id="upsn" type="number" value="10"></label>
<label>Кр<select id="krt"><option value="table1">табл.1</option><option value="table2">табл.2</option></select></label>
<label>Ko<input id="ko" type="number" step="0.05" value="0.9"></label>
<label>cosφ<input id="costg" type="number" step="0.01" value="0.95"></label>
<label>Кр ручн.<input id="krman" type="number" value="1" disabled></label>
<label><input type="checkbox" id="krovr"> перекрыв</label>
<label>Н тр.<input id="ntr" type="number" value="1"></label>
<label>k загр.<input id="kload" type="number" step="0.05" value="0.8"></label>
<label><input type="checkbox" id="engmode" checked> ИНЖЕНЕР</label>
</div></section>
<section class="card"><h2>Ведомость</h2>
<div class="toolbar">
<button class="primary" id="b-add">+</button><button id="b-dup">Дубль</button><button id="b-del">Удал.</button>
<button id="b-sortname">А-Я</button><button id="b-demo">Демо</button>
<button id="b-save">JSON</button><button id="b-load">Load</button><input type="file" id="f-json" accept=".json" hidden>
<button class="primary" id="b-ols">ОЛС</button><button id="b-pdf">PDF</button>
<button id="b-xls">Excel</button><button id="b-doc">Word</button><button class="primary" id="b-rtmdoc">Word А3</button>
</div>
<div class="scrollx"><table class="grid" id="grid"><thead></thead><tbody></tbody></table></div>
<p class="note" id="grid-foot"></p></section>
<section class="card"><h2>Итоги РТМ</h2><div class="totgrid" id="dash"></div><div class="totgrid" id="tots"></div>
<div class="scrollx" id="rtmtable"></div></section>
<section class="card"><h2>Нормативный аудит</h2><div id="audit"></div></section>
<section class="card" id="engpanel"><h2>ИНЖЕНЕР</h2><div id="eng-body"></div></section>
<section class="card"><h2>Предупреждения</h2><ul id="warnlist" class="note"></ul></section>
<section class="card" id="sheetcard" hidden><h2>ОЛС</h2><div id="sheetbox"></div></section>
</main>
<footer class="foot note">РТМ 36.18.32.4-92. КЗ — упрощённый расчёт.</footer>
<script src="loads-gost.js?v=4"></script>
<script src="loads-ned.js?v=2"></script>
<script src="nagruzki2.js?v=5"></script>
</body></html>
