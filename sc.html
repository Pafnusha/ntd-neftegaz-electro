<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Токи КЗ СН</title>
  <style>
    :root{--bg:#f4f6fa;--ink:#1a2332;--muted:#5a6a7e;--border:#d8dee8;--accent:#1b6ef3;--soft:#e8f0fe}
    *{box-sizing:border-box}
    body{margin:0;font-family:Segoe UI,system-ui,Arial,sans-serif;color:var(--ink);background:radial-gradient(900px 400px at 8% -10%,#dbe8ff,transparent 55%),var(--bg)}
    .wrap{max-width:1280px;margin:0 auto;padding:1rem 1rem 2.4rem}
    h1{margin:.2rem 0 .3rem;font-size:1.5rem}
    .sub{margin:0;color:var(--muted)} a{color:var(--accent)}
    .badge{display:inline-block;background:var(--soft);color:var(--accent);font-size:.75rem;font-weight:700;padding:.15rem .5rem;border-radius:999px}
    .panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1rem;margin:1rem 0;box-shadow:0 8px 24px rgba(26,35,50,.07)}
    .panel h2{margin:0 0 .7rem;font-size:1.05rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.55rem}
    label.field{display:flex;flex-direction:column;gap:.2rem;font-size:.76rem;color:var(--muted);font-weight:700}
    input,select,button{font:inherit}
    label.field input,label.field select{padding:.4rem .5rem;border:1px solid var(--border);border-radius:8px}
    .toolbar{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
    button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:.45rem .8rem;font-weight:700;cursor:pointer}
    button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .blocks{display:flex;gap:.5rem;flex-wrap:wrap}
    .blk{border:1px solid var(--border);border-radius:10px;padding:.55rem .6rem;min-width:210px;background:#f8fbff}
    .blk h3{margin:0 0 .4rem;font-size:.86rem}
    .blk.sys{background:#e8f0fe}.blk.cab{background:#eef8f0}.blk.tr{background:#fff6e8}.blk.bus{background:#f4f0ff}
    table{width:100%;border-collapse:collapse;font-size:.84rem}
    th{text-align:left;background:#f0f4fa;font-size:.72rem;color:var(--muted);padding:.4rem}
    td{padding:.3rem;border-bottom:1px solid #eef1f6;vertical-align:top}
    td input{width:100%;padding:.25rem;border:1px solid #e4e9f1;border-radius:6px}
    .scheme{overflow:auto;background:#f8fbff;border:1px dashed #c5d4ea;border-radius:10px;padding:.5rem}
    .note{color:var(--muted);font-size:.84rem}
    .help{font-size:.86rem;line-height:1.45}
  </style>
</head>
<body>
<div class="wrap">
  <span class="badge">ГОСТ 28249 · РД 153-34.0-20.527 · КЗ СН</span>
  <h1>Токи короткого замыкания на шинах СН</h1>
  <p class="sub">Источник → ЗРУ/РУ → КТП. <a href="index.html">Главная</a></p>
  <section class="panel"><h2>1. Система</h2>
    <div class="grid">
      <label class="field">Название<input id="sys-name" value="ПС 35 кВ, шины ВН"></label>
      <label class="field">Uср системы, кВ<input id="uc" type="number" step="0.1" value="37"></label>
      <label class="field">Iкз макс на ВН, кА<input id="ik-max" type="number" step="0.01" value="12.61"></label>
      <label class="field">Iкз мин, кА<input id="ik-min" type="number" step="0.01" value=""></label>
    </div>
    <p class="note">Для сети 35 кВ Uср обычно 37 кВ.</p>
  </section>
  <section class="panel"><h2>2. Блоки схемы</h2>
    <div class="toolbar">
      <button type="button" id="add-cab">+ Кабель / ВЛ</button>
      <button type="button" id="add-bus">+ Шины ЗРУ/РУ</button>
      <button type="button" id="add-tr">+ Трансформатор КТП</button>
      <button type="button" id="btn-demo">Пример ESS-530 / 20 МВ·А</button>
    </div>
    <div id="blocks" class="blocks"></div>
  </section>
  <section class="panel"><h2>3. Схема и результаты</h2>
    <div class="scheme" id="scheme"></div>
    <div id="res" style="overflow:auto;margin-top:.8rem"></div>
    <div class="toolbar"><button type="button" class="primary" id="btn-word">Скачать Word A4 альбом</button></div>
  </section>
  <section class="panel"><h2>Как собирать</h2>
    <div class="help"><p>Система 35 кВ → КЛ → ЗРУ → Т 35/10 → шины КТП. Все поля редактируются вручную.</p></div>
  </section>
</div>
<script src="sc-app.js"></script>
</body></html>
