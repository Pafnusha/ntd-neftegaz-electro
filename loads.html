<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>РТМ — загрузка…</title>
</head>
<body>
<script>
(async function () {
  try {
    var b64 = await (await fetch('loads.html.gz.b64')).text();
    var bin = Uint8Array.from(atob(b64.trim()), function (c) { return c.charCodeAt(0); });
    var ds = new DecompressionStream('gzip');
    var stream = new Response(bin).body.pipeThrough(ds);
    var text = await new Response(stream).text();
    document.open();
    document.write(text);
    document.close();
  } catch (e) {
    document.body.textContent = 'Ошибка загрузки loads.html: ' + e;
  }
})();
</script>
</body>
</html>
