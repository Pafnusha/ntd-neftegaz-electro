<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTM loads bootstrap</title>
</head>
<body>
<script>
(async function () {
  try {
    async function get(u){ return (await (await fetch(u)).text()).trim(); }
    var parts = [];
    for (var i = 0; i < 3; i++) parts.push(await get('loads.html.gz.b64.' + i));
    var b64 = parts.join('');
    while (b64.length % 4) b64 += '=';
    var bin = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    var ds = new DecompressionStream('gzip');
    var stream = new Response(bin).body.pipeThrough(ds);
    var text = await new Response(stream).text();
    document.open();
    document.write(text);
    document.close();
  } catch (e) {
    document.body.textContent = 'loads.html load error: ' + e;
  }
})();
</script>
</body>
</html>
